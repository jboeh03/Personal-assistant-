<?xml version="1.0" encoding="UTF-8"?>
<!--
  Westside Property Care 513 — 180px touch-icon application.
  visual-direction.md §7.3: line mark + WPC 513 + the rule. The small-caps
  line is dropped, because it is unreadable at that size and its absence is
  not a defect.

  `WPC 513` is never set on two lines, never cropped, and never split so that
  the first three letters appear without the numerals — that would produce the
  one string brand-brief.md §1.2 bans outright.

  COLOUR NOTE: see the block in favicon.svg. Icon and rule are drawn --paper;
  if his artwork differs, his artwork wins and these two values change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" role="img" aria-label="Westside Property Care 513">
  <rect width="64" height="64" fill="#0E2E52"/>
  <g fill="none" stroke="#F4F0E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 18 L25 9 L34 18"/>
    <path d="M18.5 18 V28 H31.5 V18"/>
    <path d="M43 8 L48 20 H38 Z"/>
    <path d="M43 20 V28"/>
  </g>
  <text x="32" y="46"
        font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="13" font-weight="500" letter-spacing="1.3"
        text-anchor="middle" fill="#EE7A34">WPC 513</text>
  <rect x="12" y="52" width="40" height="1" fill="#F4F0E6"/>
</svg>
